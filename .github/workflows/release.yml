# 推 tag v* 時自動 build multi-arch 映像並發佈。
#
# 兩個 registry 同時推：
#   ghcr.io/<owner>/pmflow-*          ← 一定會推。免費、無拉取次數限制、GITHUB_TOKEN 內建權限
#   docker.io/<user>/pmflow-*         ← 有設 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 才推
#
# Docker Hub 要用的話，去 repo → Settings → Secrets and variables → Actions 加兩個 secret：
#   DOCKERHUB_USERNAME  你的 Docker Hub 帳號
#   DOCKERHUB_TOKEN     Docker Hub → Account Settings → Personal access tokens
#                       建立時權限選 Read & Write（不要用登入密碼）
# 沒設就自動跳過，workflow 不會失敗。
#
# 用法：
#   git tag v1.0.0 && git push origin v1.0.0

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "手動指定版本（例如 v1.0.0-rc1）"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # component 就是映像名的後綴，必須跟 docker-compose.yml 的 image: 對得上
          - component: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - component: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # 很多 NAS 是 ARM，所以一定要交叉編譯 arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 決定要推哪些 registry
        id: reg
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGES="ghcr.io/${{ github.repository_owner }}/pmflow-${{ matrix.component }}"
          if [ -n "$DH_USER" ]; then
            IMAGES="$IMAGES"$'\n'"docker.io/$DH_USER/pmflow-${{ matrix.component }}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "→ 會推 GHCR 與 Docker Hub"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "→ 只推 GHCR（未設定 DOCKERHUB_USERNAME）"
          fi
          {
            echo "images<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 登入 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN 本身就有 GHCR 寫入權，不需要另開 PAT
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登入 Docker Hub
        if: steps.reg.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 產生標籤
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=PMFlow ${{ matrix.component }}
            org.opencontainers.image.description=開源專案管理系統
            org.opencontainers.image.licenses=MIT

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: 供應鏈簽章（GHCR）
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/pmflow-${{ matrix.component }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Trivy 弱點掃描
        continue-on-error: true      # 掃描只回報，不擋發佈
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/pmflow-${{ matrix.component }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"        # 先只回報不擋，穩定後改成 1

      - name: 上傳掃描結果
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

  release-notes:
    name: 產生 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # docker/metadata-action 的 semver 樣板會去掉 tag 開頭的 v，
      # 所以 registry 上是 0.1.1 而不是 v0.1.1。說明文件必須跟著去掉，
      # 否則使用者照著複製會拿到 manifest unknown。
      - name: 取得映像標籤（去掉開頭的 v）
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 建立 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 部署到 NAS

            ```bash
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.yml
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.env.example
            cp .env.example .env
            # 編輯 .env：至少改 POSTGRES_PASSWORD 與 JWT_SECRET
            #   openssl rand -base64 48   ← 產生 JWT_SECRET
            docker compose pull && docker compose up -d
            ```

            映像（`linux/amd64` + `linux/arm64`）：
            - `ghcr.io/${{ github.repository_owner }}/pmflow-api:${{ steps.ver.outputs.tag }}`
            - `ghcr.io/${{ github.repository_owner }}/pmflow-web:${{ steps.ver.outputs.tag }}`

            （映像標籤沒有開頭的 `v`：git tag 是 `${{ github.ref_name }}`，
            映像標籤是 `${{ steps.ver.outputs.tag }}`。）

            升級時建議先單獨跑 migration，再換 image（兩個動作可分別回滾）：

            ```bash
            docker compose run --rm api npm run migrate
            docker compose pull && docker compose up -d
            ```
